name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            core -> target
            cli -> target
            gui -> target

      # eframe needs these to build on Linux. The tests themselves run headless, so no display
      # is needed on any platform.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - name: Check formatting
        run: |
          cargo fmt --manifest-path core/Cargo.toml -- --check
          cargo fmt --manifest-path cli/Cargo.toml -- --check
          cargo fmt --manifest-path gui/Cargo.toml -- --check

      - name: Clippy
        run: |
          cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path gui/Cargo.toml --all-targets -- -D warnings

      # core's dev-dependencies include sodiumoxide, which compiles libsodium from source: that is
      # deliberate, because the compatibility tests check the file format against libsodium itself.
      # The shipped crates have no C dependency.
      - name: Test
        run: |
          cargo test --manifest-path core/Cargo.toml
          cargo test --manifest-path cli/Cargo.toml
          cargo test --manifest-path gui/Cargo.toml

      - name: Build release binaries
        run: |
          cargo build --release --manifest-path cli/Cargo.toml
          cargo build --release --manifest-path gui/Cargo.toml
