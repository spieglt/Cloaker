name: Release

# Cutting a release: bump the versions, then tag and push (e.g. v5.0.0). This builds all three
# platforms and attaches the artifacts to a draft release for you to check before publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest Ubuntu runner on offer, because the binaries we ship can't run on a glibc
          # older than the one they were built against. 22.04 is glibc 2.35; ubuntu-latest would
          # rule out Debian 12, RHEL 9 and Ubuntu 22.04 users.
          - os: ubuntu-22.04
            artifact: linux
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            cli -> target
            gui -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - name: Build
        if: runner.os != 'macOS'
        run: |
          cargo build --release --manifest-path cli/Cargo.toml
          cargo build --release --manifest-path gui/Cargo.toml

      # The runner is Apple Silicon, so the Intel half is cross-compiled here (Apple's SDK carries
      # both) and lipo merges them into one binary that runs on either kind of Mac.
      - name: Build universal macOS binaries
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          for crate in cli gui; do
            cargo build --release --manifest-path $crate/Cargo.toml --target x86_64-apple-darwin
            cargo build --release --manifest-path $crate/Cargo.toml --target aarch64-apple-darwin
          done
          mkdir -p universal
          lipo -create -output universal/cloaker \
            gui/target/x86_64-apple-darwin/release/cloaker \
            gui/target/aarch64-apple-darwin/release/cloaker
          lipo -create -output universal/cloaker_cli \
            cli/target/x86_64-apple-darwin/release/cloaker_cli \
            cli/target/aarch64-apple-darwin/release/cloaker_cli
          lipo -info universal/cloaker universal/cloaker_cli

      # linuxdeploy rejects icons that are not a standard size, which is why assets/icon.png is
      # 256x256. APPIMAGE_EXTRACT_AND_RUN avoids needing FUSE on the runner.
      #
      # linuxdeploy assembles the AppImage we ship, so it is pinned to a tagged release and checked
      # against that release's SHA-256 instead of taking whatever the moving "continuous" build
      # happens to be. To upgrade, change both values; GitHub lists each asset's digest on the
      # release page and in its API.
      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          LINUXDEPLOY_VERSION: 1-alpha-20251107-1
          LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
        run: |
          curl -fsSLo linuxdeploy "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage"
          echo "${LINUXDEPLOY_SHA256}  linuxdeploy" | sha256sum --check --strict
          chmod +x linuxdeploy
          cp gui/target/release/cloaker .
          cp gui/assets/icon.png cloaker.png
          ./linuxdeploy --appdir AppDir -e cloaker -d gui/assets/cloaker.desktop -i cloaker.png --output appimage
          mkdir -p dist
          mv Cloaker*.AppImage dist/Cloaker-x86_64.AppImage
          # the command line tool needs no bundle, so ship the binary as it is
          cp cli/target/release/cloaker_cli dist/cloaker_cli-linux-x86_64
          # smoke test: both have to start and report their version without a display
          ./dist/Cloaker-x86_64.AppImage --version
          ./dist/cloaker_cli-linux-x86_64 --version

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: |
          APP=Cloaker.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist
          cp universal/cloaker "$APP/Contents/MacOS/cloaker"
          cp gui/assets/macCloakerLogo.icns "$APP/Contents/Resources/cloaker.icns"
          cp gui/assets/Info.plist "$APP/Contents/Info.plist"
          "$APP/Contents/MacOS/cloaker" --version
          ./universal/cloaker_cli --version
          # the app has to be archived because it is a directory; ditto rather than zip preserves
          # the bundle and is what Apple's notarisation tooling expects. Re-zip a signed bundle
          # the same way.
          ditto -c -k --keepParent "$APP" dist/Cloaker-macos.zip
          # the command line tool ships on its own, as it does on the other platforms
          cp universal/cloaker_cli dist/cloaker_cli-macos

      - name: Package Windows executables
        if: runner.os == 'Windows'
        run: |
          gui/target/release/cloaker.exe --version
          cli/target/release/cloaker_cli.exe --version
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # both executables are self-contained, so they ship as they are
          Copy-Item gui/target/release/cloaker.exe dist/Cloaker-windows.exe
          Copy-Item cli/target/release/cloaker_cli.exe dist/cloaker_cli-windows.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            Cloaker-x86_64.AppImage
            cloaker_cli-linux-x86_64
            Cloaker-macos.zip
            cloaker_cli-macos
            Cloaker-windows.exe
            cloaker_cli-windows.exe
