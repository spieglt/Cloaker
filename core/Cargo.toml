[package]
name = "cloaker"
version = "5.0.0"
authors = ["Theron Spiegl <tspiegl@gmail.com>"]
edition = "2021"

[dependencies]
# pure Rust: dryoc supplies libsodium's secretstream, RustCrypto supplies the two KDFs
dryoc = "1.0"
argon2 = "0.6"
scrypt = "0.12"
zeroize = "1.8"
same-file = "1"

[dev-dependencies]
# kept as the reference implementation that the compatibility tests check the format against
sodiumoxide = "0.2.6"
